[project]
name = "home-dashboard-backend"
version = "0.1.0"
description = "Backend API for controlling my Eaton xComfort smart home controller"
readme = "README.md"
authors = [
    { name = "Milan Vojnovic", email = "milanvojnovic@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.3",
    "requests>=2.34.2",
    "uvicorn>=0.49.0",
]

[project.scripts]
home-dashboard-api = "backend.main:main" # backend (directory), main (filename), main (function)

[tool.hatch.build.targets.wheel]
packages = ["src/backend"]

[[tool.uv.index]]
name = "nexus"
url = "http://nexus.milanoid.net:8081/repository/pypi-group/simple/"
default = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff.lint]
# B008: FastAPI's `Depends(...)` in a function default is the documented,
# intended pattern - not the "mutable default" footgun this rule targets.
ignore = ["B008"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.17",
]
